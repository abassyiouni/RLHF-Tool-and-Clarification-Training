[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grpo-pipelines"
version = "0.2.0"
description = "Reusable GRPO framework with arithmetic, tool-selection, and clarification pipelines"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.6,<3",
    "transformers==4.57.1",
    "trl==0.24.0",
    "datasets>=3,<5",
    "accelerate>=1.4,<2",
]

[project.optional-dependencies]
tracking = ["wandb>=0.19,<1"]

[tool.setuptools]
py-modules = ["train_tools", "train_arithmetic", "train_clarification"]

[tool.setuptools.packages.find]
include = ["rl_framework*", "tasks*"]
exclude = ["tests*", "runs*"]

[tool.setuptools.package-data]
tasks = ["data/*.json"]
